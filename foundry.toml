[profile.default]
src = "contracts/src"
test = "contracts/test"
script = "contracts/script"
out = "contracts/out"
cache_path = "contracts/cache"
libs = ["node_modules"]
auto_detect_remappings = false
remappings = [
  "forge-std/=node_modules/forge-std/src/",
  "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/",
]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200

[fuzz]
runs = 256

[invariant]
runs = 64
depth = 32
fail_on_revert = false

[lint]
lint_on_build = false
