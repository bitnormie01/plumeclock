<svg width="1800" height="1100" viewBox="0 0 1800 1100" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">PlumeClock architecture overview</title>
  <desc id="desc">A visual architecture diagram for the PlumeClock project showing public methane data, data pinning and fixtures, smart contracts, and the public dashboard.</desc>

  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#334155"/>
    </marker>
    <style>
      .title { font: 700 34px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 500 18px 'Segoe UI', Arial, sans-serif; fill: #475569; }
      .section { font: 700 22px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .node-title { font: 700 18px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .node-text { font: 500 14px 'Segoe UI', Arial, sans-serif; fill: #1e293b; }
      .tiny { font: 600 12px 'Segoe UI', Arial, sans-serif; fill: #334155; }
      .box { fill: #f8fafc; stroke: #64748b; stroke-width: 2; rx: 18; }
      .data { fill: #ecfdf5; stroke: #16a34a; stroke-width: 2; }
      .pipeline { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; }
      .chain { fill: #fff7ed; stroke: #f97316; stroke-width: 2; }
      .ui { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 2; }
      .ops { fill: #fdf2f8; stroke: #db2777; stroke-width: 2; }
      .label { font: 600 13px 'Segoe UI', Arial, sans-serif; fill: #334155; }
      .callout { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="1800" height="1100" fill="#ffffff"/>

  <text x="900" y="52" text-anchor="middle" class="title">PlumeClock Architecture</text>
  <text x="900" y="82" text-anchor="middle" class="subtitle">From public methane alerts to on-chain response clocks and public dashboard</text>

  <!-- IMEO data -->
  <rect x="70" y="140" width="420" height="260" rx="22" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
  <text x="280" y="176" text-anchor="middle" class="section">UNEP IMEO / MARS</text>

  <rect x="110" y="210" width="150" height="80" class="box data"/>
  <text x="185" y="246" text-anchor="middle" class="node-title">Detected</text>
  <text x="185" y="268" text-anchor="middle" class="node-title">Plume Zip</text>

  <rect x="300" y="210" width="150" height="80" class="box data"/>
  <text x="375" y="246" text-anchor="middle" class="node-title">Response</text>
  <text x="375" y="268" text-anchor="middle" class="node-title">Rate Zip</text>

  <rect x="110" y="320" width="340" height="54" class="callout"/>
  <text x="280" y="354" text-anchor="middle" class="tiny">Public, provenance-checked methane data and alert metadata</text>

  <!-- Pipeline -->
  <rect x="560" y="140" width="620" height="260" rx="22" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="870" y="175" text-anchor="middle" class="section">Data Pipeline</text>

  <rect x="600" y="210" width="210" height="90" class="box pipeline"/>
  <text x="705" y="246" text-anchor="middle" class="node-title">npm run pin</text>
  <text x="705" y="268" text-anchor="middle" class="node-text">Store zips + provenance</text>

  <rect x="850" y="210" width="270" height="90" class="box pipeline"/>
  <text x="985" y="246" text-anchor="middle" class="node-title">npm run fixtures</text>
  <text x="985" y="268" text-anchor="middle" class="node-text">Build snapshot + proofs + Merkle root</text>

  <rect x="600" y="330" width="520" height="50" class="callout"/>
  <text x="860" y="362" text-anchor="middle" class="tiny">Verified data flow from raw IMEO exports to public fixture artifacts</text>

  <rect x="1170" y="140" width="550" height="260" rx="22" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text x="1445" y="176" text-anchor="middle" class="section">On-chain System</text>

  <rect x="1210" y="210" width="220" height="92" class="box chain"/>
  <text x="1320" y="246" text-anchor="middle" class="node-title">PlumeClock</text>
  <text x="1320" y="268" text-anchor="middle" class="node-text">root registry + tickets</text>

  <rect x="1475" y="210" width="200" height="92" class="box chain"/>
  <text x="1575" y="246" text-anchor="middle" class="node-title">MitigationFund</text>
  <text x="1575" y="268" text-anchor="middle" class="node-text">slash receiver</text>

  <rect x="1210" y="330" width="465" height="50" class="callout"/>
  <text x="1442" y="362" text-anchor="middle" class="tiny">Ticket lifecycle: open → respond → resolve / reopen / slash</text>

  <!-- arrows from IMEO to pipeline -->
  <line x1="490" y1="250" x2="600" y2="250" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="490" y1="250" x2="600" y2="250" stroke="#334155" stroke-width="3" marker-end="url(#arrow)" opacity="0"/>
  <line x1="705" y1="300" x2="920" y2="210" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- pipeline to onchain -->
  <line x1="1120" y1="250" x2="1210" y2="250" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1500" y1="302" x2="1500" y2="400" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- contracts and UI vertical stack -->
  <rect x="250" y="520" width="1300" height="350" rx="22" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="900" y="560" text-anchor="middle" class="section">Public UI and Workflow</text>

  <rect x="310" y="610" width="290" height="180" class="box ui"/>
  <text x="455" y="650" text-anchor="middle" class="node-title">Public Dashboard</text>
  <text x="455" y="682" text-anchor="middle" class="node-text">Next.js static app</text>
  <text x="455" y="710" text-anchor="middle" class="node-text">Map + ticket list</text>
  <text x="455" y="738" text-anchor="middle" class="node-text">Live clock + proof verify</text>

  <rect x="700" y="610" width="300" height="180" class="box ui"/>
  <text x="850" y="650" text-anchor="middle" class="node-title">Operator Actions</text>
  <text x="850" y="682" text-anchor="middle" class="node-text">Pledge bond</text>
  <text x="850" y="710" text-anchor="middle" class="node-text">Sign EIP-712 response</text>
  <text x="850" y="738" text-anchor="middle" class="node-text">Dispute / resolve</text>

  <rect x="1085" y="610" width="360" height="180" class="box ops"/>
  <text x="1265" y="650" text-anchor="middle" class="node-title">Deploy + Demo Scripts</text>
  <text x="1265" y="682" text-anchor="middle" class="node-text">npm run deploy -- --network base-sepolia</text>
  <text x="1265" y="710" text-anchor="middle" class="node-text">npm run demo -- --network base-sepolia</text>
  <text x="1265" y="738" text-anchor="middle" class="node-text">Local rehearsal on anvil</text>

  <!-- flow lines inside UI -->
  <line x1="600" y1="700" x2="700" y2="700" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1000" y1="700" x2="1085" y2="700" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="455" y1="790" x2="455" y2="880" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1265" y1="790" x2="1265" y2="880" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- bottom summary -->
  <rect x="260" y="910" width="1280" height="110" rx="18" class="callout"/>
  <text x="900" y="960" text-anchor="middle" class="node-title">One-line summary</text>
  <text x="900" y="992" text-anchor="middle" class="tiny">Public methane alerts → pinned snapshot + Merkle proofs → on-chain tickets → public dashboard → mitigation via slashing</text>

</svg>
